name: Apply 7Golden brand polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Patch site metadata and content runtime
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';

            async function getFile(path) {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(r.data)) throw new Error(`Expected file: ${path}`);
              return { sha: r.data.sha, content: Buffer.from(r.data.content, 'base64').toString('utf8') };
            }

            async function putFile(path, sha, content, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha,
                message,
                content: Buffer.from(content, 'utf8').toString('base64')
              });
            }

            const index = await getFile('index.html');
            let html = index.content;
            const replacements = [
              ['<title>ORYZO AI</title>', '<title>7Golden | Hazelnut, Pistachio & Almond Processing</title>'],
              ['<meta name="description" content="A physical product, reimagined for the AI era, proving even the smallest idea can feel extraordinary.">', '<meta name="description" content="Based in Qazvin, 7Golden processes hazelnut, pistachio and almond products for chocolate, confectionery, ice cream and other food applications.">'],
              ['<meta name="author" content="Lusion">', '<meta name="author" content="7Golden">'],
              ['<link rel="canonical" href="https://oryzo.ai/">', '<link rel="canonical" href="https://7golden.co/">'],
              ['<meta name="apple-mobile-web-app-title" content="ORYZO AI">', '<meta name="apple-mobile-web-app-title" content="7Golden">'],
              ['<meta property="og:title" content="ORYZO AI">', '<meta property="og:title" content="7Golden | Hazelnut, Pistachio & Almond Processing">'],
              ['<meta property="og:description" content="A physical product, reimagined for the AI era, proving even the smallest idea can feel extraordinary.">', '<meta property="og:description" content="Processed hazelnut, pistachio and almond ingredients for food production.">'],
              ['<meta property="og:image" content="https://oryzo.ai/meta/og_image.png">', '<meta property="og:image" content="https://7golden.co/banner/Hero-main.webp">'],
              ['<meta property="og:url" content="https://oryzo.ai/">', '<meta property="og:url" content="https://7golden.co/">'],
              ['<meta property="og:site_name" content="ORYZO AI">', '<meta property="og:site_name" content="7Golden">'],
              ['<meta name="twitter:title" content="ORYZO AI">', '<meta name="twitter:title" content="7Golden | Hazelnut, Pistachio & Almond Processing">'],
              ['<meta name="twitter:description" content="A physical product, reimagined for the AI era, proving even the smallest idea can feel extraordinary.">', '<meta name="twitter:description" content="Processed hazelnut, pistachio and almond ingredients for food production.">'],
              ['<meta name="twitter:image" content="https://oryzo.ai/meta/og_image.png">', '<meta name="twitter:image" content="https://7golden.co/banner/Hero-main.webp">']
            ];
            for (const [from, to] of replacements) html = html.replace(from, to);
            if (html === index.content) core.setFailed('No index.html replacements matched');
            else await putFile('index.html', index.sha, html, 'chore: align static metadata with 7Golden');

            const js = await getFile('7golden-content.js');
            let code = js.content;
            const jsReplacements = [
              ['.replace(/\\\\bIntro\\\\b/g, \'Our story\')', '.replace(/\\bIntro\\b/g, \'Our story\')'],
              ['.replace(/\\\\bFeatures\\\\b/g, \'Ingredients\')', '.replace(/\\bFeatures\\b/g, \'Ingredients\')'],
              ['.replace(/\\\\bProduct\\\\b/g, \'Products\')', '.replace(/\\bProduct\\b/g, \'Products\')'],
              ["if (canonical && /oryzo\\.ai/i.test(canonical.href)) canonical.remove();", "if (canonical) canonical.href = 'https://7golden.co/';"]
            ];
            for (const [from, to] of jsReplacements) code = code.replace(from, to);
            if (code !== js.content) await putFile('7golden-content.js', js.sha, code, 'fix: polish 7Golden navigation and canonical URL');

            core.info('7Golden brand polish applied.');
