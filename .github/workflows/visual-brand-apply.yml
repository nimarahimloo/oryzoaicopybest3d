name: Apply 7Golden visual layer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Patch content runtime
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '7golden-content.js';
            const branch = 'main';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            const sha = current.data.sha;
            let code = Buffer.from(current.data.content, 'base64').toString('utf8');
            const marker = '/* 7GOLDEN_VISUAL_BRAND_LAYER */';
            if (code.includes(marker)) {
              core.info('Layer already installed.');
              return;
            }
            const layer = [
              '',
              marker,
              'function apply7GoldenVisualLayer() {',
              '  if (document.getElementById(\'seven-golden-visual-style\')) return;',
              '  const style = document.createElement(\'style\');',
              '  style.id = \'seven-golden-visual-style\';',
              '  style.textContent = `',
              '    #hero { background: radial-gradient(circle at 72% 42%, rgba(181,138,58,.16), transparent 34%), linear-gradient(135deg, #17130f 0%, #242017 58%, #465b43 140%); }',
              '    #hero-video-wrapper { overflow: hidden; border-radius: 2px; border-color: rgba(244,239,229,.38) !important; }',
              '    #hero-video-thumbnail { object-fit: cover !important; filter: saturate(.94) contrast(1.04); }',
              '    #wearable-main-canvas { opacity: 0 !important; }',
              '    .wearable-gallery-item-inner { background-size: cover !important; background-position: center !important; background-repeat: no-repeat !important; }',
              '    .wearable-gallery-item[data-7golden-visual=\"true\"] { box-shadow: inset 0 0 0 1px rgba(244,239,229,.2); }',
              '  `;',
              '  document.head.appendChild(style);',
              '  const hero = document.querySelector(\'#hero-video-thumbnail\');',
              '  if (hero) { hero.src = \'/images/7golden/pistachio-bowl-green.webp\'; hero.alt = \'7Golden pistachio ingredients\'; }',
              '  const play = document.querySelector(\'#hero-video-play\');',
              '  if (play) play.textContent = \'EXPLORE RANGE\';',
              '  const visuals = [\'/images/7golden/hazelnut-category.webp\', \'/images/7golden/pistachio-category.webp\', \'/images/7golden/almond-category.webp\', \'/images/7golden/pistachio-bowl-green.webp\'];',
              '  document.querySelectorAll(\'.wearable-gallery-item\').forEach((item, index) => {',
              '    const inner = item.querySelector(\'.wearable-gallery-item-inner\');',
              '    if (!inner) return;',
              '    const src = visuals[index % visuals.length];',
              '    item.dataset.sevenGoldenVisual = \'true\';',
              '    inner.style.setProperty(\'background-image\', `url(\"${src}\")`, \'important\');',
              '    inner.style.setProperty(\'background-size\', \'cover\', \'important\');',
              '    inner.style.setProperty(\'background-position\', \'center\', \'important\');',
              '  });',
              '}',
              'if (document.readyState === \'loading\') document.addEventListener(\'DOMContentLoaded\', apply7GoldenVisualLayer, { once: true }); else apply7GoldenVisualLayer();',
              ''
            ].join('\\n');
            const end = code.lastIndexOf('})();');
            if (end < 0) throw new Error('IIFE terminator not found');
            code = code.slice(0, end) + layer + code.slice(end);
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch, sha,
              message: 'feat: apply 7Golden visual brand layer',
              content: Buffer.from(code, 'utf8').toString('base64')
            });
