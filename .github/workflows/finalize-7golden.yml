name: finalize 7golden visual brand
on:
  push:
    paths:
      - .github/workflows/finalize-7golden.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = 'nimarahimloo';
            const repo = 'oryzoaicopybest3d';
            const path = '7golden-content.js';
            const r = await github.rest.repos.getContent({owner, repo, path, ref:'main'});
            const text = Buffer.from(r.data.content, 'base64').toString('utf8');
            const marker = '/* 7GOLDEN_VISUAL_BRAND_LAYER */';
            const start = text.indexOf(marker);
            const end = text.indexOf('})();', start);
            if (start < 0 || end < 0) throw new Error('Visual layer marker/end not found');
            const layer = `/* 7GOLDEN_VISUAL_BRAND_LAYER */
function apply7GoldenVisualLayer() {
  if (document.getElementById('seven-golden-visual-style')) return;
  const style = document.createElement('style');
  style.id = 'seven-golden-visual-style';
  style.textContent = \`
    :root { --seven-ink:#17130f; --seven-forest:#314636; --seven-gold:#b58a3a; --seven-cream:#f4efe5; }
    body { background:var(--seven-ink) !important; color:var(--seven-cream); }
    #hero { background:radial-gradient(circle at 76% 38%,rgba(181,138,58,.22),transparent 30%),radial-gradient(circle at 18% 78%,rgba(49,70,54,.34),transparent 34%),linear-gradient(135deg,#17130f 0%,#211b15 55%,#314636 140%) !important; }
    #hero-top-tagline,#ai-tagline,#scroll-indicator__bar-text { letter-spacing:.08em; text-transform:uppercase; }
    #hero-copy { max-width:34rem; }
    #hero-video-wrapper { overflow:hidden; border-radius:2px; border-color:rgba(244,239,229,.35) !important; box-shadow:0 24px 80px rgba(0,0,0,.28); }
    #hero-video-thumbnail { object-fit:cover !important; filter:saturate(.9) contrast(1.06); }
    #ai { background:#f4efe5 !important; color:#17130f !important; }
    #ai .o-dashline { border-color:rgba(23,19,15,.25) !important; }
    #ai-instruction-text,#ai-desc,#ai-disclaimer { color:#17130f !important; }
    #wearable { background:#1c211b !important; }
    #wearable-main-canvas { opacity:0 !important; pointer-events:none; }
    .wearable-gallery-item-inner { background-size:cover !important; background-position:center !important; background-repeat:no-repeat !important; box-shadow:inset 0 0 0 1px rgba(244,239,229,.18); }
    #features { background:#f4efe5 !important; color:#17130f !important; }
    #testimonies { background:#314636 !important; }
    #footer { background:#17130f !important; }
    #footer a:hover { color:#b58a3a !important; }
    @media (max-width:767px) { #hero-copy{max-width:none;} #hero-video-wrapper{margin-top:1.5rem;} #wearable-main-canvas{display:none !important;} }
  \`;
  document.head.appendChild(style);
  const hero = document.querySelector('#hero-video-thumbnail');
  if (hero) { hero.src='/images/7golden/pistachio-bowl-green.webp'; hero.alt='7Golden pistachio ingredients'; }
  const play = document.querySelector('#hero-video-play');
  if (play) play.textContent='EXPLORE RANGE';
  const visuals=['/images/7golden/hazelnut-category.webp','/images/7golden/pistachio-category.webp','/images/7golden/almond-category.webp','/images/7golden/pistachio-bowl-green.webp'];
  document.querySelectorAll('.wearable-gallery-item').forEach((item,index)=>{ const inner=item.querySelector('.wearable-gallery-item-inner'); if(!inner)return; const src=visuals[index%visuals.length]; item.dataset.sevenGoldenVisual='true'; inner.style.setProperty('background-image',\`url(\"\${src}\")\`,'important'); inner.style.setProperty('background-size','cover','important'); inner.style.setProperty('background-position','center','important'); });
}
if (document.readyState==='loading') document.addEventListener('DOMContentLoaded',apply7GoldenVisualLayer,{once:true}); else apply7GoldenVisualLayer();
`;
            const updated = text.slice(0,start) + layer + '})();';
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:'Finalize 7Golden visual brand layer',content:Buffer.from(updated).toString('base64'),sha:r.data.sha,branch:'main'});