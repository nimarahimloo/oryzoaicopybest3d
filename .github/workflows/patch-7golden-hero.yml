name: Patch 7Golden hero

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Patch 7Golden hero script loader'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add hero fix script loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '<script src="/7golden-content.js"></script>'
          loader = marker + '<script src="/7golden-hero-fix.js"></script>'
          if '/7golden-hero-fix.js' not in s:
              if marker not in s:
                  raise SystemExit('7golden-content.js script tag not found')
              s = s.replace(marker, loader, 1)
              p.write_text(s)
          PY
          rm -f .github/workflows/patch-7golden-hero.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/patch-7golden-hero.yml
          git commit -m 'Patch 7Golden hero script loader'
          git push
