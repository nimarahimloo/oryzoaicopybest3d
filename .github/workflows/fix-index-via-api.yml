name: Fix index safely

on:
  push:
    paths:
      - '.github/workflows/fix-index-via-api.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original index and add runtime content layer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git show 0b6590cd71a33be0824c2b48ece5d666953a9c15:index.html > /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/index.html')
          s = p.read_text()
          s = s.replace('</head>', '<script src="/7golden-content.js"></script></head>', 1)
          Path('index.html').write_text(s)
          PY
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          path = Path('index.html')
          content = base64.b64encode(path.read_bytes()).decode()
          api = 'https://api.github.com/repos/nimarahimloo/oryzoaicopybest3d/contents/index.html'
          req = urllib.request.Request(api, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req) as r:
              current = json.load(r)
          body = json.dumps({
              'message': 'Restore original markup and use runtime 7Golden content',
              'content': content,
              'sha': current['sha'],
              'branch': 'main'
          }).encode()
          put = urllib.request.Request(api, data=body, method='PUT', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(put) as r:
              print(r.read().decode())
          PY
